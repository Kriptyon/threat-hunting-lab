input {
  udp {
    port => 5000
    type => "syslog"
  }
  tcp {
    port => 5044
    type => "beats"
  }
}

filter {
  if [type] == "syslog" {

    # SSH brute force detection
    if [message] =~ "Failed password" {
      mutate {
        add_tag => ["ssh_failed_auth"]
        add_field => { "alert_type" => "SSH Failed Authentication" }
        add_field => { "severity" => "medium" }
      }
      grok {
        match => {
          "message" => "Failed password for %{USER:ssh_user} from %{IP:src_ip} port %{NUMBER:src_port}"
        }
      }
    }

    # Privilege escalation detection
    if [message] =~ "sudo" and [message] =~ "COMMAND" {
      mutate {
        add_tag => ["privilege_escalation"]
        add_field => { "alert_type" => "Sudo Command Execution" }
        add_field => { "severity" => "high" }
      }
      grok {
        match => {
          "message" => "%{USER:sudo_user}.*COMMAND=%{GREEDYDATA:sudo_command}"
        }
      }
    }

    # Suspicious cron job detection
    if [message] =~ "cron" and [message] =~ "CMD" {
      mutate {
        add_tag => ["suspicious_cron"]
        add_field => { "alert_type" => "Cron Job Execution" }
        add_field => { "severity" => "high" }
      }
    }

    # Reverse shell detection
    if [message] =~ "bash -i" or [message] =~ "/dev/tcp" or [message] =~ "nc -e" {
      mutate {
        add_tag => ["reverse_shell"]
        add_field => { "alert_type" => "Possible Reverse Shell" }
        add_field => { "severity" => "critical" }
      }
    }

  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "threat-hunting-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
