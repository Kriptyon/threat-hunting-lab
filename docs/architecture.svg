<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Threat Hunting Lab — Network Architecture</title>
  <desc>Docker network diagram showing attacker scripts targeting a victim container, logs flowing to Logstash, then Elasticsearch, then Kibana.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Docker network background -->
  <rect x="30" y="30" width="620" height="340" rx="16" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text font-family="monospace" font-size="12" fill="#868e96" x="50" y="52">Docker network: threat-hunting-lab_default</text>

  <!-- ATTACKER -->
  <rect x="50" y="75" width="140" height="64" rx="8" fill="#fff5f5" stroke="#e03131" stroke-width="1.2"/>
  <text font-family="sans-serif" font-size="13" font-weight="600" fill="#c92a2a" x="120" y="101" text-anchor="middle">Attacker</text>
  <text font-family="sans-serif" font-size="11" fill="#e03131" x="120" y="120" text-anchor="middle">attack scripts</text>

  <!-- VICTIM -->
  <rect x="50" y="220" width="140" height="64" rx="8" fill="#fff9db" stroke="#e67700" stroke-width="1.2"/>
  <text font-family="sans-serif" font-size="13" font-weight="600" fill="#e67700" x="120" y="246" text-anchor="middle">Victim</text>
  <text font-family="sans-serif" font-size="11" fill="#e67700" x="120" y="265" text-anchor="middle">ubuntu:22.04 · SSH :2222</text>

  <!-- LOGSTASH -->
  <rect x="260" y="147" width="150" height="64" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2"/>
  <text font-family="sans-serif" font-size="13" font-weight="600" fill="#5f3dc4" x="335" y="173" text-anchor="middle">Logstash</text>
  <text font-family="sans-serif" font-size="11" fill="#7048e8" x="335" y="192" text-anchor="middle">detection pipeline</text>

  <!-- ELASTICSEARCH -->
  <rect x="470" y="75" width="160" height="64" rx="8" fill="#e6fcf5" stroke="#0ca678" stroke-width="1.2"/>
  <text font-family="sans-serif" font-size="13" font-weight="600" fill="#087f5b" x="550" y="101" text-anchor="middle">Elasticsearch</text>
  <text font-family="sans-serif" font-size="11" fill="#0ca678" x="550" y="120" text-anchor="middle">8.13.0 · port 9200</text>

  <!-- KIBANA -->
  <rect x="470" y="220" width="160" height="64" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.2"/>
  <text font-family="sans-serif" font-size="13" font-weight="600" fill="#1864ab" x="550" y="246" text-anchor="middle">Kibana</text>
  <text font-family="sans-serif" font-size="11" fill="#1971c2" x="550" y="265" text-anchor="middle">8.13.0 · localhost:5601</text>

  <!-- Attacker → Victim: SSH attack -->
  <line x1="120" y1="139" x2="120" y2="218" stroke="#e03131" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 3"/>
  <text font-family="sans-serif" font-size="10" fill="#e03131" x="128" y="184">SSH attack</text>

  <!-- Attacker → Logstash: syslog UDP -->
  <path d="M190 107 Q230 107 230 179 L258 179" fill="none" stroke="#e03131" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 3"/>
  <text font-family="sans-serif" font-size="10" fill="#e03131" x="194" y="150">syslog :5000</text>

  <!-- Victim → Logstash: logs -->
  <path d="M190 252 Q230 252 230 179 L258 179" fill="none" stroke="#868e96" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="10" fill="#868e96" x="194" y="226">logs</text>

  <!-- Logstash → Elasticsearch -->
  <path d="M410 162 L468 130" fill="none" stroke="#868e96" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="10" fill="#868e96" x="416" y="140">enriched events</text>

  <!-- Elasticsearch → Kibana -->
  <line x1="550" y1="139" x2="550" y2="218" stroke="#868e96" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line x1="50" y1="360" x2="80" y2="360" stroke="#e03131" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text font-family="sans-serif" font-size="11" fill="#495057" x="86" y="364">attack traffic</text>
  <line x1="190" y1="360" x2="220" y2="360" stroke="#868e96" stroke-width="1.2"/>
  <text font-family="sans-serif" font-size="11" fill="#495057" x="226" y="364">log / event flow</text>
</svg>
